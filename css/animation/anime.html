<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .parent{
            width: 400px;
            height: 400px;
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .first{
            width: 100px;
            height: 100px;
            padding: 20px;
            background-color: red;
            animation: dance 5s ease-in-out infinite;
            
        }
      
      .swing-in-bottom-fwd {
	-webkit-animation: swing-in-bottom-fwd 5s cubic-bezier(0.175, 0.885, 0.320, 1.275) infinite both;
	        animation: swing-in-bottom-fwd 5s cubic-bezier(0.175, 0.885, 0.320, 1.275) infinite both;
}

@-webkit-keyframes swing-in-bottom-fwd {
  0% {
    -webkit-transform: rotateX(100deg);
            transform: rotateX(100deg);
    -webkit-transform-origin: bottom;
            transform-origin: bottom;
    opacity: 0;
  }
  100% {
    -webkit-transform: rotateX(0);
            transform: rotateX(0);
    -webkit-transform-origin: bottom;
            transform-origin: bottom;
    opacity: 1;
  }
}
@keyframes swing-in-bottom-fwd {
  0% {
    -webkit-transform: rotateX(100deg);
            transform: rotateX(100deg);
    -webkit-transform-origin: bottom;
            transform-origin: bottom;
    opacity: 0;
  }
  100% {
    -webkit-transform: rotateX(0);
            transform: rotateX(0);
    -webkit-transform-origin: bottom;
            transform-origin: bottom;
    opacity: 1;
  }
}

    </style>
</head>
<body>
    <div class="parent swing-in-bottom-fwd">
        <h1>hello i am heading one </h1>
        <p>i am a fullstack software engineer with over 7
             years of experience in web development.

        </p>
        <div class="first">
            <h3>heading three</h3>
        </div>
    </div>
</body>
</html>
