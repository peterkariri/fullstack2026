        there are various types of apis {
            rest api>>uses http requests to get data from a server
            soap api>>uses xml to get data from a server
            graphql api>>uses a query language to get data from a server
        }
        rest apis >>{
            rest stands for representational state transfer
            it is a architectural style for designing networked applications
            it uses http requests to get data from a server
            it is stateless>>each request from a client to a server must contain all the information needed to understand and process the request
            it is cacheable>>responses must define themselves as cacheable or not to prevent clients from reusing stale or inappropriate data in response to further requests
            it is layered system>>a client cannot ordinarily tell whether it is connected directly to the end server, or to an intermediary along the way
        }
    }

//using the asyn await for larger data sets ,implement security over this data and handle errors with try catch block{
//we use the astn await to hande the fetch then when handling the response from the usl we await
//to avoid fetchng everthng we use the _limit quesry to limit the number of object items fetched (?_limit=10)


let container=document.querySelector(".container")
async function getData(){
    try {
        //cehck if my response is correct 
        let response=await fetch('https://jsonplaceholder.typicode.com/todos?_limit=100');//awaiting your response from the url
        if(!response.ok){
            throw new Error("FAILED TO FETCH INFORMATION FROM THE URL")//throwing an error if the response is not ok
        } //server state awaiting conversion to json format
        let data=await response.json();//awaiting the conversion of the response to a json format
        
        let content=''

        data.forEach((item)=>{
             content+=`
        <div class="card">
            <h1>${item.id}</h1>
            <h2>${item.title}</h2>
            <p>${item.completed}</p>
        </div>
        `
        })
            container.innerHTML=content;//display the content in the dom

        
    } catch (error) {
        container.innerHTML=`<h1>${error.message}</h1>`//display the error message in the dom
    }
}
getData()

</script>
