<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        th, td{
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th{
            background-color: #333;
            color: white;
        }

        button{
            padding: 10px 20px;
            background-color: orange;
            color: white;
            border: none;
        }
    </style>

</head>
<body>

    <h1>Shopping Cart</h1>

    <table>

        <tr>
            <th>Product</th>
            <th>Price</th>
        </tr>

        <tr>
            <td>Laptop</td>
            <td>KES 50,000</td>
        </tr>

        <tr>
            <td>Headphones</td>
            <td>KES 3,000</td>
        </tr>

    </table>

    <h2>Total: KES 53,000</h2>

    <button>Checkout</button>

</body>
</html>
